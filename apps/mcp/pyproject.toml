[project]
name = "plane-extras-mcp"
version = "0.1.0"
description = "MCP server exposing this Plane fork's worklogs and custom fields to Claude"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.30.0",
]

[project.scripts]
plane-extras-mcp = "plane_extras_mcp.server:main"

[dependency-groups]
test = [
    "pytest==8.4.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plane_extras_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
